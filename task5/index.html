<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <h1 class="game__title">Simon Says</h1>
        <div class="game__info">
            <span class="game__level">Уровень: <b id="level">0</b></span>
        </div>

        <div class="board" id="board">
            <button class="sector sector--green"  data-index="0" type="button"></button>
            <button class="sector sector--red"    data-index="1" type="button"></button>
            <button class="sector sector--yellow" data-index="2" type="button"></button>
            <button class="sector sector--blue"   data-index="3" type="button"></button>
        </div>

        <div class="game__controls">
            <button class="btn btn--start" id="startBtn" type="button">Старт</button>
        </div>

        <p class="game__status" id="status">Нажмите «Старт», чтобы начать</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
