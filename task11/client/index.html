<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zen-Money</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Zen-Money</h1>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="summary-heading">
      <h2 id="summary-heading">Сводка</h2>
      <dl class="summary" id="summary">
        <div><dt>Доходы</dt><dd id="summary-income">0</dd></div>
        <div><dt>Расходы</dt><dd id="summary-expense">0</dd></div>
        <div><dt>Баланс</dt><dd id="summary-balance">0</dd></div>
      </dl>
    </section>

    <section class="panel" aria-labelledby="filters-heading">
      <h2 id="filters-heading">Фильтры</h2>
      <form id="filters-form" class="filters">
        <label>Тип
          <select id="filter-type">
            <option value="">Все</option>
            <option value="income">Доходы</option>
            <option value="expense">Расходы</option>
          </select>
        </label>
        <label>Категория
          <select id="filter-category"><option value="">Все</option></select>
        </label>
        <label>С
          <input type="date" id="filter-from" />
        </label>
        <label>По
          <input type="date" id="filter-to" />
        </label>
        <button type="submit">Применить</button>
        <button type="button" id="filters-reset">Сбросить</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">Новая операция</h2>
      <form id="transaction-form" class="tx-form" novalidate>
        <label>Сумма
          <input type="number" id="tx-amount" min="0.01" step="0.01" required />
        </label>
        <label>Тип
          <select id="tx-type" required>
            <option value="expense">Расход</option>
            <option value="income">Доход</option>
          </select>
        </label>
        <label>Категория
          <select id="tx-category" required></select>
        </label>
        <label>Дата
          <input type="date" id="tx-date" required />
        </label>
        <label>Комментарий
          <input type="text" id="tx-comment" />
        </label>
        <button type="submit">Добавить</button>
      </form>
      <p id="form-message" class="message" role="status"></p>
    </section>

    <section class="panel" aria-labelledby="new-cat-heading">
      <h2 id="new-cat-heading">Новая категория</h2>
      <form id="category-form" class="cat-form" novalidate>
        <label>Название
          <input type="text" id="cat-name" required />
        </label>
        <label>Тип
          <select id="cat-type" required>
            <option value="expense">Расход</option>
            <option value="income">Доход</option>
          </select>
        </label>
        <button type="submit">Создать</button>
      </form>
      <p id="category-message" class="message" role="status"></p>
    </section>

    <section class="panel panel--wide" aria-labelledby="list-heading">
      <h2 id="list-heading">Операции</h2>
      <p id="list-state" class="message" role="status">Загрузка…</p>
      <ul id="transactions" class="tx-list"></ul>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
