<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo-list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Список задач</h1>

    <form class="todo-form" id="todo-form">
      <input type="text" id="todo-input" placeholder="Новая задача..." autocomplete="off">
      <button type="submit">Добавить</button>
    </form>

    <p class="counter" id="counter">Осталось: 0, Выполнено: 0</p>

    <div class="filters" id="filters">
      <button type="button" data-filter="all" class="active">Все</button>
      <button type="button" data-filter="active">Активные</button>
      <button type="button" data-filter="completed">Завершённые</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
