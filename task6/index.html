<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка — MVC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Змейка</h1>
      <div class="hud">
        <span class="hud__label">Счёт:</span>
        <span class="hud__value" id="score">0</span>
      </div>
    </header>

    <div class="board">
      <canvas id="game" width="600" height="600"></canvas>

      <!-- Оверлей виден сразу (без hidden) для стартового экрана -->
      <div class="overlay" id="overlay">
        <div class="overlay__content">
          <h2 class="overlay__title" id="overlay-title">Змейка</h2>
          <p class="overlay__text" id="overlay-text">Нажмите «Старт», чтобы начать игру</p>
          <button class="btn" id="restart-btn" type="button">Старт</button>
        </div>
      </div>
    </div>

    <p class="hint">Управление: стрелки клавиатуры (↑ ↓ ← →). Пробел — пауза/продолжить.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
